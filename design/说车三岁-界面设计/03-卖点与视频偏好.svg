name="里程（万公里）"><text x="201" y="282" fill="#55596F" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="10.5" font-weight="500" text-anchor="start">里程（万公里）</text><rect x="201" y="292" width="153" height="37" rx="10" fill="#F7F7FC" stroke="#EEEEF5"/><text x="213" y="316" fill="#8A8DA1" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="12" font-weight="400" text-anchor="start">例如 3.2</text></g></g>
<g id="Section_SellingPoints" data-name="车辆卖点与快捷标签"><rect x="20" y="361" width="350" height="187" rx="20" fill="#EEEEF6"/><rect x="20" y="359" width="350" height="187" rx="20" fill="#FFFFFF"/><g transform="translate(36 375) scale(0.7916666666666666)" fill="none" stroke="#6554E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z"/><path d="M20 2v4m-2-2h4"/></g><text x="64" y="391" fill="#202235" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="15" font-weight="600" text-anchor="start">这辆车，有哪些亮点？</text><text x="353" y="390" fill="#8A8DA1" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="10" font-weight="400" text-anchor="end">0 / 300</text><g id="Field_SellingPoints" data-name="车辆卖点多行输入框"><rect x="36" y="405" width="318" height="76" rx="12" fill="#F7F7FC" stroke="#EEEEF5"/><text x="48" y="428" fill="#8A8DA1" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="12" font-weight="400" text-anchor="start">写下车况、配置和推荐理由…</text><text x="48" y="451" fill="#A2A4B5" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="11" font-weight="400" text-anchor="start">例如：全景天窗，后排空间宽敞，</text><text x="48" y="469" fill="#A2A4B5" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="11" font-weight="400" text-anchor="start">保养记录齐全，适合日常家用。</text></g><g id="Button_AddPoint_Space" data-name="+ 空间宽敞" data-role="option" data-selected="false"><rect x="36" y="493" width="98" height="28" rx="9" fill="#F7F7FB" stroke="#EEEEF5"/><text x="85.0" y="511.5" fill="#55596F" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle">+ 空间宽敞</text></g><g id="Button_AddPoint_Service" data-name="+ 保养齐全" data-role="option" data-selected="false"><rect x="145" y="493" width="99" height="28" rx="9" fill="#F7F7FB" stroke="#EEEEF5"/><text x="194.5" y="511.5" fill="#55596F" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle">+ 保养齐全</text></g><g id="Button_AddPoint_Features" data-name="+ 配置丰富" data-role="option" data-selected="false"><rect x="255" y="493" width="99" height="28" rx="9" fill="#F7F7FB" stroke="#EEEEF5"/><text x="304.5" y="511.5" fill="#55596F" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle">+ 配置丰富</text></g><text x="36" y="536" fill="#8A8DA1" font-family="&#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif" font-size="10" font-weight="400" text-anchor="start">点选标签即可补充，也可以直接修改</text></g>
